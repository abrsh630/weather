
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-container">

        <header class="header">
            <h1>WeatherNow</h1>
            <p>Check the weather anywhere in the world</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >
            <button id="searchBtn">Search</button>
        </section>

        <!-- Loading and Error Messages -->
        <p id="loading" class="message hidden">
            Loading weather data...
        </p>

        <p id="errorMessage" class="error hidden"></p>

        <!-- Current Weather -->
        <section class="weather-card">

            <div class="location">
                <h2 id="cityName">City Name</h2>
                <p id="date">Date</p>
            </div>

            <div class="current-weather">

                <div class="weather-icon">
                    <img id="weatherIcon"
                         src="https://openweathermap.org/img/wn/01d@2x.png"
                         alt="Weather icon">
                </div>

                <div class="temperature">
                    <h1 id="temperature">--°C</h1>
                    <p id="description">Weather condition</p>
                </div>

            </div>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-box">
                    <span>Humidity</span>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail-box">
                    <span>Wind Speed</span>
                    <h3 id="windSpeed">-- m/s</h3>
                </div>

                <div class="detail-box">
                    <span>Feels Like</span>
                    <h3 id="feelsLike">--°C</h3>
                </div>

                <div class="detail-box">
                    <span>Pressure</span>
                    <h3 id="pressure">-- hPa</h3>
                </div>

            </div>

        </section>

        <!-- Forecast Section -->
        <section class="forecast-section">
            <h2>5-Day Forecast</h2>

            <div id="forecastContainer" class="forecast-container">
                <p>Forecast data will appear here.</p>
            </div>
        </section>

        <footer>
            <p>WeatherNow | Built with JavaScript & Fetch API</p>
        </footer>

    </main>

    <script src="index.js"></script>
</body>
</html>
